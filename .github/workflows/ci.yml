name: tests

on:
  push:
    branches: [main]
  pull_request:

# The tests only read the repository. Every action is pinned to a commit (the version is in the comment);
# tests/test_workflows.py keeps both facts.
permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-lock.txt
      - run: python compiler/plotly_fetch.py
      - run: python compiler/casclib_build.py
      - run: python -m pytest -q
