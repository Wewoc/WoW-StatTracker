name: release

# Push a tag like v0.1.0 -> tests, build, GitHub release with StatTracker.zip + .sha256
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-dev.txt pyinstaller
      - run: python -m pytest -q
      - name: Tag must match APP_VERSION
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, "src")
          import app_info
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != app_info.APP_VERSION:
              sys.exit(f"tag {tag} != APP_VERSION {app_info.APP_VERSION}")
      - run: python compiler/build.py --no-venv
      - name: Release title and notes from the tag message
        shell: bash
        run: |
          # First line of the annotated tag message = title, the rest = notes.
          tag="$GITHUB_REF_NAME"
          git fetch --force origin "+refs/tags/${tag}:refs/tags/${tag}"
          if [ "$(git cat-file -t "refs/tags/${tag}")" = "tag" ]; then
            echo "RELEASE_NAME=$(git tag -l --format='%(contents:subject)' "$tag")" >> "$GITHUB_ENV"
            git tag -l --format='%(contents:body)' "$tag" > release-notes.md
          else
            echo "::warning::${tag} is not an annotated tag, the release gets no title and no notes"
            echo "RELEASE_NAME=${tag}" >> "$GITHUB_ENV"
            : > release-notes.md
          fi
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: release-notes.md
          files: |
            dist/StatTracker.zip
            dist/StatTracker.zip.sha256
