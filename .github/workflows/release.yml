name: release

# Push a tag like v0.1.0 -> the build job (read-only) runs the tests and builds StatTracker.zip + .sha256;
# the publish job (the only one that may write) checks the checksum again and makes the GitHub release.
# Every action is pinned to a commit (the version is in the comment); tests/test_workflows.py keeps that
# and the rule that only the publish job has write access.
on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install -r requirements-lock.txt
      - run: python compiler/plotly_fetch.py
      - run: python compiler/casclib_build.py
      - run: python -m pytest -q
      - name: Tag must match APP_VERSION
        shell: python
        run: |
          import os, sys
          sys.path.insert(0, "src")
          from core import app_info
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          if tag != app_info.APP_VERSION:
              sys.exit(f"tag {tag} != APP_VERSION {app_info.APP_VERSION}")
      - run: python compiler/build.py --no-venv --require-casclib
      - name: Release title and notes from the tag message
        shell: bash
        run: |
          # First line of the annotated tag message = title, the rest = notes; both go into dist/ and travel with the files.
          tag="$GITHUB_REF_NAME"
          git fetch --force origin "+refs/tags/${tag}:refs/tags/${tag}"
          if [ "$(git cat-file -t "refs/tags/${tag}")" = "tag" ]; then
            git tag -l --format='%(contents:subject)' "$tag" > dist/release-name.txt
            git tag -l --format='%(contents:body)' "$tag" > dist/release-notes.md
          else
            echo "::warning::${tag} is not an annotated tag, the release gets no title and no notes"
            echo "${tag}" > dist/release-name.txt
            : > dist/release-notes.md
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/StatTracker.zip
            dist/StatTracker.zip.sha256
            dist/release-name.txt
            dist/release-notes.md

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: The checksum must match the ZIP
        shell: python
        run: |
          import hashlib, sys
          expected = open("dist/StatTracker.zip.sha256", encoding="ascii").read().split()[0].lower()
          actual = hashlib.sha256(open("dist/StatTracker.zip", "rb").read()).hexdigest()
          if expected != actual:
              sys.exit(f"checksum mismatch: {expected} != {actual}")
      - name: Release title
        shell: bash
        run: echo "RELEASE_NAME=$(tr -d '\r' < dist/release-name.txt)" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ env.RELEASE_NAME }}
          body_path: dist/release-notes.md
          files: |
            dist/StatTracker.zip
            dist/StatTracker.zip.sha256
