<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatTracker</title>
<style>
  :root { --bg:#121212; --panel:#1b1b1b; --line:#2e2e2e; --fg:#e0e0e0; --dim:#8a8a8a; --gold:#f4c430; --best:#5dd16b;
          --field:#101010; --head:#1e1e1e; --hover:#1a1a1a; --track:#2a2a2a; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, Arial, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; }
  h1 { color: var(--gold); margin: 0 0 4px; font-size: 1.4rem; }
  .sub { color: var(--dim); font-size: .85rem; margin-bottom: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--panel);
         border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; }
  input[type=search], select { background: var(--field); color: var(--fg); border: 1px solid var(--line);
         padding: 6px 8px; border-radius: 4px; font-size: .9rem; }
  input[type=search] { min-width: 220px; }
  button { background: var(--field); color: var(--fg); border: 1px solid var(--line); padding: 4px 10px;
           border-radius: 4px; font-size: .85rem; cursor: pointer; }
  button:hover { border-color: var(--gold); color: var(--gold); }
  button:disabled { color: var(--dim); border-color: var(--line); opacity: .5; cursor: default; }
  label { font-size: .85rem; cursor: pointer; white-space: nowrap; }
  .chars label { background:var(--field); border:1px solid var(--line); padding:3px 8px; border-radius:12px; }
  .count { color: var(--dim); font-size: .85rem; margin: 6px 2px; }
  .wrap { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; font-size: .88rem; }
  th { position: sticky; top: 0; background: var(--head); color: var(--gold); z-index: 1; cursor: pointer; user-select: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.cat { color: var(--dim); font-size: .8rem; }
  td.best { color: var(--best); font-weight: 700; }
  tr:hover td { background: var(--hover); }
  .small { font-size: .72rem; color: var(--dim); font-weight: 400; display: block; }
  .sugg { position: relative; display: inline-block; }
  .sugg-list { position: absolute; top: 100%; left: 0; z-index: 10; min-width: 100%; width: max-content; max-width: 560px; max-height: 340px; overflow: auto;
               margin: 2px 0 0; padding: 4px 0; list-style: none; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
  .sugg-list[hidden] { display: none; }
  .sugg-list li { padding: 4px 12px; cursor: pointer; font-size: .88rem; }
  .sugg-list li:hover, .sugg-list li.active { background: var(--hover); }
  .sugg-list li.info { color: var(--dim); font-size: .78rem; cursor: default; }
  .sugg-list li.info:hover { background: none; }
  .empty { padding: 24px; color: var(--dim); }
  details.rates { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
                  padding: 8px 12px; margin-bottom: 8px; }
  details.rates summary { cursor: pointer; color: var(--gold); font-size: .95rem; }
  .rwrap { overflow: auto; max-height: 50vh; margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; }
  .rwrap th { cursor: default; }
  tr.total td { font-weight: 700; background: var(--head); }
  .note { color: var(--dim); font-size: .78rem; margin-top: 6px; }
  .gbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; }
  .gbar .lbl { color: var(--dim); font-size: .8rem; }
  .gbar label { background:var(--field); border:1px solid var(--line); padding:3px 8px; border-radius:12px; }
  .gnone { padding: 10px 2px; color: var(--dim); font-size: .85rem; }
  .gbar .chip { background:var(--field); border:1px solid var(--line); padding:3px 8px; border-radius:12px; font-size:.85rem; }
  .gbar .chip button { border: 0; background: none; padding: 0 0 0 6px; font-size: .95rem; }
  .gbar a.hlink { background:var(--field); border:1px solid var(--line); padding:3px 8px; border-radius:12px;
                  font-size:.85rem; color: var(--fg); text-decoration: none; }
  .gbar a.hlink:hover { border-color: var(--gold); color: var(--gold); }
  .gbar a.hlink span { color: var(--dim); }
  .rbar { height: 5px; min-width: 110px; max-width: 260px; background: var(--track); border-radius: 3px; margin-top: 3px; }
  .rbar i { display: block; height: 100%; background: var(--gold); border-radius: 3px; }
  .rbar.par i { background: var(--best); }
  #rpt td.rcat { background: var(--head); color: var(--gold); font-weight: 700; }
  #rpt td.rsub { color: var(--dim); font-weight: 700; }
  #rpt td.rhead { font-weight: 700; }
  #rpt td.rcell { min-width: 130px; vertical-align: top; }
  #rpt td.rname { vertical-align: top; }
  #xstat { max-width: 340px; }
  .foot { color: var(--dim); font-size: .8rem; margin: 12px 2px 0; }
  .foot a { color: var(--dim); }
  .foot a:hover { color: var(--gold); }
  .tiles { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
  .tile { flex: 1 1 170px; min-width: 150px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; }
  .tile .tname { color: var(--dim); font-size: .82rem; }
  .tile .tval { color: var(--gold); font-size: 1.5rem; font-weight: 700; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .tile .tscope { font-size: .85rem; }
  [data-slot] { display: contents; }   /* a numbered place (src/pages/blocks/layout.py) adds no box of its own */
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="sub" id="gen"></div>

<div data-slot="10"></div>
<div data-slot="1"></div>
<div data-slot="2"></div>
<div data-slot="3"></div>
<div data-slot="4"></div>
<div data-slot="5"></div>
<div data-slot="8"></div>
<div data-slot="9"></div>

<script>
const DATA = /*__DATA__*/null;

const $ = id => document.getElementById(id);

// UI texts come from the generator (src/core/i18n.py, html_* keys); {name} marks a value to fill in.
const UI = (DATA && DATA.ui) || {};
const fmt = (s, vals) => (s || "").replace(/\{(\w+)\}/g, (_, k) => (k in vals ? vals[k] : ""));

function init() {
  document.documentElement.lang = (DATA && DATA.lang) || "en";
  document.title = UI.title || "StatTracker";
  $("title").textContent = UI.title || "StatTracker";
  if (!DATA || !DATA.chars.length) {
    document.body.insertAdjacentHTML("beforeend", '<div class="empty"></div>');
    document.querySelector(".empty").textContent = UI.no_data || "";
    return;
  }
  $("gen").textContent = fmt(UI.generated, {generated: DATA.generated, chars: DATA.chars.length, stats: DATA.stats.length});
  if (DATA.snapshot && UI.snapshot) $("gen").textContent += " · " + fmt(UI.snapshot, DATA.snapshot);          // written by "Open in browser" (outputs.write_snapshot)
  STT.start();
}

// The blocks that Python writes (src/pages/blocks/*.py, the numbered places above): a control with data-action is an action; the program
// window sends it to Python through its bridge (QWebChannel), the answer is the list of parts of the block that changed
// ({id, html?, hidden?, disabled?, checked?}). Without the bridge (the file opened in a browser) those controls are disabled and the blocks
// stay as they were written.
const STT = (() => {
  let bridge = null, lastKeys = null;
  const live = () => typeof QWebChannel !== "undefined" && typeof qt !== "undefined" && !!qt.webChannelTransport;
  const parse = text => { try { return JSON.parse(text); } catch (e) { return null; } };
  const apply = list => (list || []).forEach(u => {
    const el = document.getElementById(u.id);
    if (!el) return;
    if ("html" in u) el.innerHTML = u.html;
    if ("hidden" in u) el.hidden = u.hidden;
    if ("disabled" in u) el.disabled = u.disabled;
    if ("checked" in u) el.checked = u.checked;
  });
  // the ticked characters: the boxes of the character selection (place 4), in the order of the page
  const ticked = () => [...document.querySelectorAll("input[data-pick]")].filter(e => e.checked).map(e => e.dataset.name);
  const controls = place => {
    const c = {};
    // a box with a list of suggestions (data-suggest) hands over the text that was applied last (data-committed), not what is being typed
    place.querySelectorAll("[data-name]").forEach(e => {
      c[e.dataset.name] = e.type === "checkbox" ? e.checked : (e.dataset.committed !== undefined ? e.dataset.committed : e.value);
    });
    return c;
  };
  const typing = {};          // per search box: the number of the last message and the timer that waits for the next key
  function send(el, last, action) {
    const place = el.closest("[data-slot]");
    if (!bridge || !place) return;
    const args = Object.assign({}, el.dataset, {value: el.value, checked: !!el.checked, controls: controls(place)});
    delete args.action; delete args.name; delete args.then;
    bridge.act(Number(place.dataset.slot), action || el.dataset.action, JSON.stringify(args), res => {
      if (last && !last()) return;
      apply(parse(res));
      if (el.dataset.then === "selection") selection();          // the answer changed the boxes of the selection: the other blocks follow
    });
  }
  // a search box: wait a moment after the last key, and drop the answer of a message that a newer one has replaced (the answer replaces the same parts)
  function sendTyped(el) {
    const t = typing[el.id] || (typing[el.id] = {n: 0, timer: null, closed: false});
    clearTimeout(t.timer);
    t.closed = false;
    t.timer = setTimeout(() => { const n = ++t.n; send(el, () => n === t.n && !t.closed); }, Number(el.dataset.delay) || 150);
  }
  // suggestions under a search box: the list is written by Python (the id is in data-suggest); keys and mouse only choose from it, and what is
  // chosen (or Enter, or an emptied box) is applied: data-commit names the action that then rebuilds what the box filters
  const listOf = el => document.getElementById(el.dataset.suggest);
  const entries = list => [...list.querySelectorAll("li[data-value]")];
  function closeList(el) {
    const list = listOf(el);
    if (list) { list.hidden = true; list.textContent = ""; }
    const t = typing[el.id];
    if (t) { clearTimeout(t.timer); t.closed = true; t.n++; }          // an answer that is still on its way must not open the list again
  }
  function commit(el) {
    closeList(el);
    el.dataset.committed = el.value;
    send(el, null, el.dataset.commit);
  }
  document.addEventListener("click", e => { const b = e.target.closest("button[data-action], th[data-action]"); if (b) send(b); });
  document.addEventListener("change", e => {
    if (e.target.matches("select[data-action], input[type=checkbox][data-action]")) send(e.target);
    else if (e.target.matches("input[data-pick]")) selection();
  });
  document.addEventListener("input", e => {
    const el = e.target;
    if (!el.matches("input[type=search][data-action]")) return;
    if (el.dataset.suggest && el.value.trim() === "") { commit(el); return; }          // emptied: the filter goes at once
    sendTyped(el);
  });
  document.addEventListener("keydown", e => {
    const el = e.target;
    if (!el.matches || !el.matches("input[data-suggest]")) return;
    const list = listOf(el), items = list ? entries(list) : [];
    let at = items.findIndex(li => li.classList.contains("active"));
    if ((e.key === "ArrowDown" || e.key === "ArrowUp") && !list.hidden && items.length) {
      e.preventDefault();
      at = e.key === "ArrowDown" ? (at + 1) % items.length : (at <= 0 ? items.length - 1 : at - 1);
      items.forEach((li, i) => li.classList.toggle("active", i === at));
      items[at].scrollIntoView({block: "nearest"});
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (!list.hidden && at >= 0) el.value = items[at].dataset.value;
      commit(el);
    } else if (e.key === "Escape") {
      closeList(el);
    }
  });
  document.addEventListener("mousedown", e => {
    const li = e.target.closest && e.target.closest(".sugg-list li[data-value]");
    if (li) {                                                                           // before the box loses the focus
      e.preventDefault();
      const el = li.closest(".sugg").querySelector("input[data-suggest]");
      el.value = li.dataset.value;
      commit(el);
      return;
    }
    document.querySelectorAll("input[data-suggest]").forEach(el => { if (!el.closest(".sugg").contains(e.target)) closeList(el); });
  });
  // the ticked characters changed: the blocks that depend on them are told (only when the set really changed)
  function selection() {
    const keys = JSON.stringify(ticked());
    if (!bridge || keys === lastKeys) return;
    lastKeys = keys;
    const all = {};
    document.querySelectorAll("[data-slot]").forEach(s => { all[s.dataset.slot] = controls(s); });
    bridge.select(keys, JSON.stringify(all), res => Object.values(parse(res) || {}).forEach(apply));
  }
  return {
    get ready() { return bridge !== null; },
    start() {
      if (!live()) { document.querySelectorAll("[data-slot] [data-action], [data-slot] [data-pick]").forEach(e => { e.disabled = true; }); return; }
      new QWebChannel(qt.webChannelTransport, ch => {
        bridge = ch.objects.bridge;
        lastKeys = JSON.stringify(DATA.chars.map(c => c.key));          // Python starts with every character ticked
        bridge.attach(JSON.stringify(DATA), res => { apply(parse(res)); selection(); });
      });
    },
    selection,
  };
})();

init();
</script>
</body>
</html>
