<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatTracker</title>
<style>
  :root { --bg:#121212; --panel:#1b1b1b; --line:#2e2e2e; --fg:#e0e0e0; --dim:#8a8a8a; --gold:#f4c430; --best:#5dd16b; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, Arial, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; }
  h1 { color: var(--gold); margin: 0 0 4px; font-size: 1.4rem; }
  .sub { color: var(--dim); font-size: .85rem; margin-bottom: 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--panel);
         border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; margin-bottom: 8px; }
  input[type=search], select { background: #101010; color: var(--fg); border: 1px solid var(--line);
         padding: 6px 8px; border-radius: 4px; font-size: .9rem; }
  input[type=search] { min-width: 220px; }
  button { background: #101010; color: var(--fg); border: 1px solid var(--line); padding: 4px 10px;
           border-radius: 4px; font-size: .85rem; cursor: pointer; }
  button:hover { border-color: var(--gold); color: var(--gold); }
  button:disabled { color: var(--dim); border-color: var(--line); opacity: .5; cursor: default; }
  label { font-size: .85rem; cursor: pointer; white-space: nowrap; }
  .chars label { background:#101010; border:1px solid var(--line); padding:3px 8px; border-radius:12px; }
  .count { color: var(--dim); font-size: .85rem; margin: 6px 2px; }
  .wrap { overflow: auto; max-height: calc(100vh - 230px); border: 1px solid var(--line); border-radius: 6px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border-bottom: 1px solid var(--line); padding: 6px 10px; text-align: left; font-size: .88rem; }
  th { position: sticky; top: 0; background: #1e1e1e; color: var(--gold); z-index: 1; cursor: pointer; user-select: none; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  td.cat { color: var(--dim); font-size: .8rem; }
  td.best { color: var(--best); font-weight: 700; }
  tr:hover td { background: #1a1a1a; }
  .small { font-size: .72rem; color: var(--dim); font-weight: 400; display: block; }
  .empty { padding: 24px; color: var(--dim); }
  details.rates { background: var(--panel); border: 1px solid var(--line); border-radius: 6px;
                  padding: 8px 12px; margin-bottom: 8px; }
  details.rates summary { cursor: pointer; color: var(--gold); font-size: .95rem; }
  .rwrap { overflow: auto; max-height: 50vh; margin-top: 8px; border: 1px solid var(--line); border-radius: 6px; }
  .rwrap th { cursor: default; }
  tr.total td { font-weight: 700; background: #1e1e1e; }
  .note { color: var(--dim); font-size: .78rem; margin-top: 6px; }
  .gbar { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; margin-top: 8px; }
  .gbar .lbl { color: var(--dim); font-size: .8rem; }
  .gbar label { background:#101010; border:1px solid var(--line); padding:3px 8px; border-radius:12px; }
  .gnone { padding: 10px 2px; color: var(--dim); font-size: .85rem; }
  .gbar .chip { background:#101010; border:1px solid var(--line); padding:3px 8px; border-radius:12px; font-size:.85rem; }
  .gbar .chip button { border: 0; background: none; padding: 0 0 0 6px; font-size: .95rem; }
  #xstat { max-width: 340px; }
  .foot { color: var(--dim); font-size: .8rem; margin: 12px 2px 0; }
  .foot a { color: var(--dim); }
  .foot a:hover { color: var(--gold); }
</style>
</head>
<body>
<h1 id="title"></h1>
<div class="sub" id="gen"></div>

<div class="bar">
  <input type="search" id="q">
  <select id="cat"></select>
  <label><input type="checkbox" id="diff"> <span id="lblDiff"></span></label>
  <label><input type="checkbox" id="hideEmpty" checked> <span id="lblEmpty"></span></label>
</div>
<div class="bar chars" id="chars"></div>
<details class="rates" id="rates">
  <summary id="ratesTitle"></summary>
  <div class="rwrap"><table id="rt"><thead></thead><tbody></tbody></table></div>
  <div class="note" id="ratesNote"></div>
</details>
<details class="rates groups" id="groups">
  <summary id="groupsTitle"></summary>
  <div id="presetBox" hidden>
    <div class="gbar">
      <span class="lbl" id="lblPreset"></span>
      <select id="presetSel"></select>
      <input type="search" id="presetName" maxlength="40">
      <button type="button" id="presetSave"></button>
      <button type="button" id="presetDel"></button>
      <span class="lbl" id="presetMsg"></span>
    </div>
    <div class="note" id="presetNote"></div>
  </div>
  <div class="gbar"><span class="lbl" id="lblGroupBy"></span><select id="groupBy"></select></div>
  <div class="gbar" id="groupPick"></div>
  <div class="gbar" id="figures"></div>
  <div class="gbar">
    <span class="lbl" id="lblExtra"></span>
    <input type="search" id="xq">
    <select id="xstat"></select>
    <select id="xagg"></select>
    <button type="button" id="xadd"></button>
  </div>
  <div class="gbar" id="extraChips" hidden></div>
  <div class="note" id="extraNote"></div>
  <div class="gnone" id="groupsNone" hidden></div>
  <div class="rwrap" id="groupsWrap"><table id="gt"><thead></thead><tbody></tbody></table></div>
  <div class="note" id="groupsNote"></div>
</details>
<div class="count" id="count"></div>
<div class="wrap"><table id="t"><thead></thead><tbody></tbody></table></div>
<div class="foot" id="foot"></div>

<script>
const DATA = /*__DATA__*/null;

const $ = id => document.getElementById(id);
const EMPTY = "--";
let sortChar = null;   // char key, or null = category/name
let sortDir = -1;      // -1 = descending

// UI texts come from the generator (src/i18n.py, html_* keys); {name} marks a value to fill in.
const UI = (DATA && DATA.ui) || {};
const fmt = (s, vals) => (s || "").replace(/\{(\w+)\}/g, (_, k) => (k in vals ? vals[k] : ""));

function isEmpty(cell) { return !cell || cell[0] === EMPTY || cell[0] === ""; }
function selected() { return DATA.chars.filter(c => $("chk_" + c.key).checked); }

// One button: "Select all" while at least one character is unchecked, "Deselect all" when all are checked.
function syncToggle() {
  const all = DATA.chars.every(c => $("chk_" + c.key).checked);
  $("toggleAll").textContent = all ? (UI.deselect_all || "") : (UI.select_all || "");
}
function toggleAll() {
  const all = DATA.chars.every(c => $("chk_" + c.key).checked);
  DATA.chars.forEach(c => { $("chk_" + c.key).checked = !all; });
  render();
}

function init() {
  document.documentElement.lang = (DATA && DATA.lang) || "en";
  document.title = UI.title || "StatTracker";
  $("title").textContent = UI.title || "StatTracker";
  if (!DATA || !DATA.chars.length) {
    document.body.insertAdjacentHTML("beforeend", '<div class="empty"></div>');
    document.querySelector(".empty").textContent = UI.no_data || "";
    return;
  }
  $("gen").textContent = fmt(UI.generated, {generated: DATA.generated, chars: DATA.chars.length, stats: DATA.stats.length});
  $("q").placeholder = UI.search || "";
  $("lblDiff").textContent = UI.only_diff || "";
  $("lblEmpty").textContent = UI.hide_empty || "";

  const cats = [...new Set(DATA.stats.map(s => s.cat))].sort();
  const sel = $("cat");
  sel.add(new Option(UI.all_cats || "", ""));
  cats.forEach(c => sel.add(new Option(c, c)));

  const box = $("chars");
  const tg = document.createElement("button");
  tg.type = "button"; tg.id = "toggleAll";
  tg.addEventListener("click", toggleAll);
  box.append(tg);
  DATA.chars.forEach(c => {
    const l = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true; cb.id = "chk_" + c.key;
    cb.addEventListener("change", render);
    l.append(cb, " " + c.key);
    box.append(l);
  });

  ["q", "cat", "diff", "hideEmpty"].forEach(id => $(id).addEventListener("input", render));
  setupGroups();
  setupPresets();
  renderRates();
  renderFoot();
  render();
}

// Version, link to the project page and copyright (values from src/app_info.py via the generator).
function renderFoot() {
  const A = DATA.app;
  if (!A) return;
  const link = document.createElement("a");
  link.href = A.site; link.target = "_blank"; link.rel = "noopener noreferrer";
  link.textContent = A.site.replace(/^https:\/\//, "").replace(/\/$/, "");
  $("foot").append(fmt(UI.footer_version, {version: A.version}), " · ", link, " · " + A.copyright + " · " + A.license);
}

// Rates per played hour (computed by the generator, src/stat_derive.py); static, whatever is checked above.
function fmtRate(v) {
  const d = v === 0 ? 0 : v >= 100 ? 0 : v >= 10 ? 1 : v >= 0.1 ? 2 : 3;
  return v.toLocaleString(DATA.lang, {minimumFractionDigits: d, maximumFractionDigits: d});
}

function renderRates() {
  const D = DATA.derived;
  if (!D || !D.roles || !D.roles.length) { $("rates").hidden = true; return; }
  $("ratesTitle").textContent = UI.rates_title || "";
  $("ratesNote").textContent = fmt(UI.rates_note, {hours: D.min_played_seconds / 3600});

  const hr = $("rt").tHead.insertRow();
  const th0 = document.createElement("th");
  th0.textContent = UI.rates_col_char || "";
  hr.append(th0);
  D.roles.forEach(r => {
    const th = document.createElement("th");
    th.className = "num"; th.textContent = r.label;
    hr.append(th);
  });

  // A rate, or "–" with the reason; the total also says how many characters it is made of.
  const cell = (res, isTotal) => {
    const td = document.createElement("td");
    td.className = "num";
    const small = document.createElement("span");
    small.className = "small";
    if (res && "rate" in res) {
      td.textContent = fmtRate(res.rate);
      if (isTotal) small.textContent = fmt(UI.rates_total_of, {used: res.used, of: res.of});
    } else {
      td.textContent = "–";
      small.textContent = (res && res.why) || "";
    }
    if (small.textContent) td.append(small);
    return td;
  };

  const body = $("rt").tBodies[0];
  const total = body.insertRow();
  total.className = "total";
  total.insertCell().textContent = UI.rates_total || "";
  D.roles.forEach(r => total.append(cell(r.total, true)));
  DATA.chars.forEach(c => {
    const tr = body.insertRow();
    const first = tr.insertCell();
    first.textContent = c.key;
    const s = document.createElement("span");
    s.className = "small";
    s.textContent = [c.race, c.class, c.level].filter(Boolean).join(" · ");
    first.append(s);
    D.roles.forEach(r => tr.append(cell(r.chars[c.key], false)));
  });
}

// Groups: the characters ticked above, grouped by class, race, faction or realm. Computed here from the
// page data (the rules are in the note under the table). Class and race are grouped by the language
// independent file name from the game; a character without one (scanned before the addon recorded it)
// is "unknown". Nothing is guessed from the stored, gender dependent text.
const GROUP_BY = ["class", "race", "faction", "realm"];
const BY_LABEL = {class: UI.groups_by_class, race: UI.groups_by_race, faction: UI.groups_by_faction, realm: UI.groups_by_realm};
const FACTION = {Alliance: UI.faction_Alliance, Horde: UI.faction_Horde, Neutral: UI.faction_Neutral};
const groupOff = {};          // per grouping: keys of the groups that are unticked
const figureOff = new Set();  // ids of the figures that are unticked
const extras = [];            // statistics added by hand: {id, agg}
const AGG_LABEL = {sum: UI.groups_agg_sum, avg: UI.groups_agg_avg, max: UI.groups_agg_max};
const AGG = {sum: v => v.reduce((a, b) => a + b, 0), avg: v => v.reduce((a, b) => a + b, 0) / v.length, max: v => Math.max(...v)};
const GOLD_RE = /^(?:\d[\d.,]*\s*[gsc]\s*)+$/;   // "12g 5s 3c" (the pattern of stat_parser.to_number): the stored number is copper
const STATS = new Map(((DATA && DATA.stats) || []).map(s => [s.id, s]));

const own = (obj, key) => (Object.prototype.hasOwnProperty.call(obj, key) ? obj[key] : undefined);
const isNum = v => typeof v === "number" && isFinite(v);
const sum = list => list.reduce((a, b) => a + b, 0);
const num = (v, digits) => v.toLocaleString(DATA.lang, {minimumFractionDigits: digits, maximumFractionDigits: digits});

function groupKey(c, by) {
  if (by === "class") return c.class_file || null;
  if (by === "race") return c.race_file || null;
  if (by === "faction") return c.faction || null;
  const i = c.key.indexOf("-");   // "Name-Realm": cut at the first hyphen, a realm name can contain one
  return i > 0 && i < c.key.length - 1 ? c.key.slice(i + 1) : null;
}

function groupLabel(by, key, members) {
  if (key === null) return UI.groups_unknown || "";
  if (by === "faction") return own(FACTION, key) || key;
  if (by === "realm") return key;
  const known = own((DATA.names || {})[by] || {}, key);
  if (known) return known;
  // a file name this program does not know yet: the text stored with the newest scan of the group
  const newest = members.slice().sort((a, b) => (a.scanned_at < b.scanned_at ? 1 : -1))[0];
  return (by === "class" ? newest.class : newest.race) || key;
}

function buildGroups(chars, by) {
  const map = new Map();
  chars.forEach(c => {
    const key = groupKey(c, by);
    if (!map.has(key)) map.set(key, []);
    map.get(key).push(c);
  });
  const list = [...map].map(([key, members]) => ({key, members, label: groupLabel(by, key, members)}));
  list.sort((a, b) => (a.key === null) - (b.key === null) || a.label.localeCompare(b.label, DATA.lang));
  return list;
}

// One column of the group table: calc(members) gives {text, of: [used, total]} or {} for "no value".
function figureList() {
  const list = [
    {id: "chars", label: UI.groups_fig_chars, calc: m => ({text: num(m.length, 0)})},
    {id: "level", label: UI.groups_fig_level, calc: m => {
      const v = m.map(c => c.level).filter(isNum);
      return v.length ? {text: num(sum(v) / v.length, 1), of: [v.length, m.length]} : {};
    }},
    {id: "played", label: UI.groups_fig_played, calc: m => {
      const p = DATA.stats.find(s => s.id === -1);   // played time, seconds (src/stat_parser.PLAYED_STATS)
      const v = p ? m.map(c => p.v[c.key]).filter(x => x && isNum(x[1])).map(x => x[1]) : [];
      return v.length ? {text: fmt(UI.groups_hours, {n: num(sum(v) / 3600, 1)}), of: [v.length, m.length]} : {};
    }},
  ];
  // rates: sum of counters / sum of hours of the group (not the mean of the rates), like "Total" above
  ((DATA.derived && DATA.derived.roles) || []).forEach(r => list.push({id: "role_" + r.role, label: r.label, calc: m => {
    const used = m.map(c => r.chars[c.key]).filter(x => x && "rate" in x);
    const hours = sum(used.map(x => x.hours));
    return used.length && hours > 0 ? {text: fmtRate(sum(used.map(x => x.amount)) / hours), of: [used.length, m.length]} : {};
  }}));
  return list;
}

// A statistic added by hand, combined over the group with the chosen function. Only characters with a
// number for it count ("n of m"); a gold statistic is shown in gold.
function extraFigure(e) {
  const s = STATS.get(e.id);
  const gold = !!s && Object.values(s.v).some(x => x && GOLD_RE.test(String(x[0]).trim()));
  return {id: "x" + e.id + "_" + e.agg, label: (s ? s.name : String(e.id)) + " (" + AGG_LABEL[e.agg] + ")", cat: s ? s.cat : "",
    calc: m => {
      const v = s ? m.map(c => s.v[c.key]).filter(x => x && isNum(x[1])).map(x => x[1]) : [];
      if (!v.length) return {};
      const r = AGG[e.agg](v);
      return {text: gold ? fmt(UI.groups_gold, {n: num(r / 10000, 2)}) : num(r, Number.isInteger(r) ? 0 : 2), of: [v.length, m.length]};
    }};
}

function renderExtraPicker(chars) {
  const q = $("xq").value.trim().toLowerCase();
  const sel = $("xstat");
  const keep = sel.value;
  sel.textContent = "";
  DATA.stats.forEach(s => {
    if (s.id < 0) return;   // played time is a figure of its own
    if (q && !(s.name.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q))) return;
    if (!chars.some(c => s.v[c.key] && isNum(s.v[c.key][1]))) return;   // nothing to combine
    sel.add(new Option(s.name + " (" + s.cat + ")", String(s.id)));
  });
  if ([...sel.options].some(o => o.value === keep)) sel.value = keep;
}

function renderExtraChips() {
  const box = $("extraChips");
  box.textContent = "";
  box.hidden = !extras.length;
  extras.forEach((e, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    const rm = document.createElement("button");
    rm.type = "button"; rm.textContent = "×"; rm.title = UI.groups_remove || "";
    rm.addEventListener("click", () => { extras.splice(i, 1); renderGroups(); });
    chip.append(extraFigure(e).label, rm);
    box.append(chip);
  });
}

function figureCell(res) {
  const td = document.createElement("td");
  td.className = "num";
  const small = document.createElement("span");
  small.className = "small";
  if (res.text === undefined) {
    td.textContent = "–";
    small.textContent = UI.groups_no_value || "";
  } else {
    td.textContent = res.text;
    if (res.of && res.of[0] < res.of[1]) small.textContent = fmt(UI.rates_total_of, {used: res.of[0], of: res.of[1]});
  }
  if (small.textContent) td.append(small);
  return td;
}

function setupGroups() {
  $("groupsTitle").textContent = UI.groups_title || "";
  $("lblGroupBy").textContent = UI.groups_by || "";
  const sel = $("groupBy");
  GROUP_BY.forEach(k => sel.add(new Option(BY_LABEL[k] || k, k)));
  sel.addEventListener("change", renderGroups);
  const bar = $("figures");
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = UI.groups_figures || "";
  bar.append(lbl);
  figureList().forEach(f => {
    const l = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = true; cb.id = "fig_" + f.id;
    cb.addEventListener("change", () => { if (cb.checked) figureOff.delete(f.id); else figureOff.add(f.id); renderGroups(); });
    l.append(cb, " " + f.label);
    bar.append(l);
  });
  const hours = (DATA.derived ? DATA.derived.min_played_seconds : 3600) / 3600;
  $("groupsNote").textContent = fmt(UI.groups_note, {hours: hours});

  $("lblExtra").textContent = UI.groups_extra || "";
  $("xq").placeholder = UI.search || "";
  $("xq").addEventListener("input", renderGroups);
  Object.keys(AGG).forEach(k => $("xagg").add(new Option(AGG_LABEL[k] || k, k)));
  $("xadd").textContent = UI.groups_add || "";
  $("xadd").addEventListener("click", () => {
    const id = Number($("xstat").value), agg = $("xagg").value;
    if ($("xstat").value === "" || extras.some(e => e.id === id && e.agg === agg)) return;
    extras.push({id, agg});
    renderGroups();
  });
  $("extraNote").textContent = UI.groups_extra_note || "";
}

// Presets of the Groups block: the grouping, the figures and the added statistics (not the characters or
// groups ticked, they change with every scan). They live in the localStorage of the browser, which all local
// pages share; where the storage is blocked the row is hidden and the block works as before.
const PRESET_KEY = "stattracker.groupPresets";
const PRESET_NAME_MAX = 40;
let presets = [];

function storageUsable() {
  try { localStorage.getItem(PRESET_KEY); return true; } catch (e) { return false; }
}

// Read from the storage every time (another page may have changed it); whatever is not shaped like a preset is dropped.
function readPresets() {
  let raw;
  try { raw = JSON.parse(localStorage.getItem(PRESET_KEY) || "[]"); } catch (e) { return []; }
  if (!Array.isArray(raw)) return [];
  const seen = new Set();
  return raw.filter(p => {
    const ok = p && typeof p.name === "string" && p.name !== "" && p.name.length <= PRESET_NAME_MAX && !seen.has(p.name)
      && typeof p.by === "string" && Array.isArray(p.off) && Array.isArray(p.extras);
    if (ok) seen.add(p.name);
    return ok;
  });
}

function writePresets() {
  try { localStorage.setItem(PRESET_KEY, JSON.stringify(presets)); return true; } catch (e) { return false; }
}

function renderPresetSel(keep) {
  const sel = $("presetSel");
  sel.textContent = "";
  sel.add(new Option(UI.groups_preset_none || "", ""));
  presets.forEach(p => sel.add(new Option(p.name, p.name)));
  sel.value = presets.some(p => p.name === keep) ? keep : "";
  $("presetDel").disabled = sel.value === "";
}

// Figures and statistics this page does not have are skipped; the groups ticked stay as they are.
function applyPreset(p) {
  if (GROUP_BY.includes(p.by)) $("groupBy").value = p.by;
  const off = new Set(p.off);
  figureOff.clear();
  figureList().forEach(f => {
    if (off.has(f.id)) figureOff.add(f.id);
    $("fig_" + f.id).checked = !off.has(f.id);
  });
  extras.length = 0;
  p.extras.forEach(e => {
    if (!e || !isNum(e.id) || e.id < 0 || !STATS.has(e.id) || typeof e.agg !== "string" || !own(AGG, e.agg)) return;
    if (!extras.some(x => x.id === e.id && x.agg === e.agg)) extras.push({id: e.id, agg: e.agg});
  });
  renderGroups();
}

function setupPresets() {
  if (!storageUsable()) return;
  $("presetBox").hidden = false;
  $("lblPreset").textContent = UI.groups_preset || "";
  $("presetName").placeholder = UI.groups_preset_name || "";
  $("presetSave").textContent = UI.groups_preset_save || "";
  $("presetDel").textContent = UI.groups_preset_delete || "";
  $("presetNote").textContent = UI.groups_preset_note || "";
  presets = readPresets();
  renderPresetSel("");

  $("presetSel").addEventListener("change", () => {
    const name = $("presetSel").value;
    $("presetMsg").textContent = "";
    presets = readPresets();
    const p = presets.find(x => x.name === name);
    if (p) applyPreset(p);
    renderPresetSel(p ? name : "");
  });
  $("presetSave").addEventListener("click", () => {
    const name = $("presetName").value.trim().slice(0, PRESET_NAME_MAX);
    if (!name) return;
    const entry = {name, by: $("groupBy").value, off: [...figureOff], extras: extras.map(e => ({id: e.id, agg: e.agg}))};
    presets = readPresets();
    const i = presets.findIndex(p => p.name === name);
    if (i >= 0) presets[i] = entry; else presets.push(entry);
    if (writePresets()) { $("presetMsg").textContent = ""; } else { $("presetMsg").textContent = UI.groups_preset_failed || ""; presets = readPresets(); }
    renderPresetSel(name);
  });
  $("presetDel").addEventListener("click", () => {
    const name = $("presetSel").value;
    if (name === "") return;
    presets = readPresets().filter(p => p.name !== name);
    $("presetMsg").textContent = writePresets() ? "" : (UI.groups_preset_failed || "");
    presets = readPresets();
    renderPresetSel("");
  });
}

function renderGroups() {
  const chars = selected();
  const by = $("groupBy").value;
  renderExtraPicker(chars);
  renderExtraChips();
  const groups = buildGroups(chars, by);
  const off = groupOff[by] || (groupOff[by] = new Set());

  const pick = $("groupPick");
  pick.textContent = "";
  const lbl = document.createElement("span");
  lbl.className = "lbl"; lbl.textContent = UI.groups_pick || "";
  pick.append(lbl);
  groups.forEach(g => {
    const l = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = !off.has(g.key);
    cb.addEventListener("change", () => { if (cb.checked) off.delete(g.key); else off.add(g.key); renderGroups(); });
    l.append(cb, " " + g.label + " (" + g.members.length + ")");
    pick.append(l);
  });

  const none = $("groupsNone");
  none.hidden = chars.length > 0;
  none.textContent = chars.length ? "" : (UI.groups_none_selected || "");
  $("groupsWrap").hidden = !chars.length;
  const head = $("gt").tHead, body = $("gt").tBodies[0];
  head.textContent = ""; body.textContent = "";
  if (!chars.length) return;

  const figs = figureList().filter(f => !figureOff.has(f.id)).concat(extras.map(extraFigure));
  const hr = head.insertRow();
  const th0 = document.createElement("th");
  th0.textContent = UI.groups_col_group || "";
  hr.append(th0);
  figs.forEach(f => {
    const th = document.createElement("th");
    th.className = "num"; th.textContent = f.label;
    if (f.cat) {
      const s = document.createElement("span");
      s.className = "small"; s.textContent = f.cat;
      th.append(s);
    }
    hr.append(th);
  });

  const shown = groups.filter(g => !off.has(g.key));
  shown.forEach(g => {
    const tr = body.insertRow();
    tr.insertCell().textContent = g.label;
    figs.forEach(f => tr.append(figureCell(f.calc(g.members))));
  });
  if (shown.length) {
    const members = shown.flatMap(g => g.members);
    const tr = body.insertRow();
    tr.className = "total";
    tr.insertCell().textContent = UI.rates_total || "";
    figs.forEach(f => tr.append(figureCell(f.calc(members))));
  }
}

function render() {
  syncToggle();
  const chars = selected();
  const q = $("q").value.trim().toLowerCase();
  const cat = $("cat").value;
  const onlyDiff = $("diff").checked;
  const hideEmpty = $("hideEmpty").checked;

  // header
  const head = $("t").tHead;
  head.textContent = "";
  const hr = head.insertRow();
  const mk = (txt, cls, key) => {
    const th = document.createElement("th");
    th.textContent = txt; if (cls) th.className = cls;
    th.addEventListener("click", () => {
      if (sortChar === key) sortDir = -sortDir; else { sortChar = key; sortDir = -1; }
      render();
    });
    return th;
  };
  hr.append(mk(UI.col_cat || "", "", null), mk(UI.col_stat || "", "", null));
  chars.forEach(c => {
    const th = mk(c.key, "num", c.key);
    [[c.race, c.class, c.level], [c.scanned_at]].forEach(parts => {   // two lines: who, and when scanned
      const s = document.createElement("span");
      s.className = "small";
      s.textContent = parts.filter(Boolean).join(" · ");
      if (s.textContent) th.append(s);
    });
    hr.append(th);
  });

  // filter rows
  let rows = DATA.stats.filter(s => {
    if (cat && s.cat !== cat) return false;
    if (q && !(s.name.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q))) return false;
    const cells = chars.map(c => s.v[c.key]);
    if (hideEmpty && cells.every(isEmpty)) return false;
    if (onlyDiff && chars.length > 1) {
      const set = new Set(cells.map(x => x ? x[0] : EMPTY));
      if (set.size < 2) return false;
    }
    return true;
  });

  if (sortChar) {
    const val = s => { const c = s.v[sortChar]; return c && c[1] !== null ? c[1] : -Infinity; };
    rows = rows.slice().sort((a, b) => (val(a) - val(b)) * sortDir || a.name.localeCompare(b.name));
  }

  const body = $("t").tBodies[0];
  body.textContent = "";
  const frag = document.createDocumentFragment();
  rows.forEach(s => {
    const tr = document.createElement("tr");
    const tc = document.createElement("td"); tc.className = "cat"; tc.textContent = s.cat;
    const tn = document.createElement("td"); tn.textContent = s.name;
    tr.append(tc, tn);

    const cells = chars.map(c => s.v[c.key]);
    let best = null;
    const nums = cells.map(x => x ? x[1] : null);
    if (chars.length > 1 && nums.every(n => n !== null) && new Set(nums).size > 1) best = Math.max(...nums);

    cells.forEach(x => {
      const td = document.createElement("td");
      td.className = "num";
      td.textContent = x ? x[0] : "–";
      if (best !== null && x && x[1] === best) td.classList.add("best");
      tr.append(td);
    });
    frag.append(tr);
  });
  body.append(frag);
  $("count").textContent = fmt(UI.count, {shown: rows.length, total: DATA.stats.length});
  renderGroups();
}

init();
</script>
</body>
</html>
