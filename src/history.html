<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>StatTracker</title>
<style>
  :root { --bg:#121212; --panel:#1b1b1b; --line:#2e2e2e; --fg:#e0e0e0; --dim:#8a8a8a; --gold:#f4c430; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { font-family: system-ui, Arial, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; }
  h1 { color: var(--gold); margin: 0 0 4px; font-size: 1.4rem; }
  .sub { color: var(--dim); font-size: .85rem; margin-bottom: 4px; }
  a.back { color: var(--dim); text-decoration: none; }
  a.back:hover { color: var(--gold); }
  .bar { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; background: var(--panel);
         border: 1px solid var(--line); padding: 10px 12px; border-radius: 6px; margin: 12px 0 8px; }
  input[type=search], select { background: #101010; color: var(--fg); border: 1px solid var(--line);
         padding: 6px 8px; border-radius: 4px; font-size: .9rem; }
  input[type=search] { min-width: 220px; }
  button { background: #101010; color: var(--fg); border: 1px solid var(--line); padding: 4px 10px;
           border-radius: 4px; font-size: .85rem; cursor: pointer; }
  button:hover { border-color: var(--gold); color: var(--gold); }
  label { font-size: .85rem; cursor: pointer; }
  .count { color: var(--dim); font-size: .85rem; }
  .main { display: grid; grid-template-columns: minmax(240px, 340px) 1fr; gap: 8px; align-items: start; }
  @media (max-width: 800px) { .main { grid-template-columns: 1fr; } }
  .lead { color: var(--dim); font-size: .8rem; margin: 0 0 6px; }
  .list { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; max-height: 560px;
          overflow: auto; padding: 6px 10px; }
  .list label { display: block; padding: 3px 0; }
  .list label.off { opacity: .45; cursor: default; }
  .list .cat { display: block; margin-left: 22px; color: var(--dim); font-size: .72rem; }
  .chartbox { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 8px; min-height: 120px; }
  #chart { width: 100%; height: 480px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
  .chip { background: #101010; border: 1px solid var(--line); padding: 3px 8px; border-radius: 12px; font-size: .85rem; }
  .chip button { border: 0; background: none; padding: 0 0 0 6px; font-size: .95rem; }
  .chip i { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .hint { padding: 24px 8px; color: var(--dim); font-size: .9rem; }
  .note { color: var(--dim); font-size: .78rem; margin-top: 6px; }
  .empty { padding: 24px; color: var(--dim); }
  .foot { color: var(--dim); font-size: .8rem; margin: 12px 2px 0; }
  .foot a { color: var(--dim); }
  .foot a:hover { color: var(--gold); }
  .gear { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; margin: 12px 0 8px; }
  .gear > summary { cursor: pointer; padding: 9px 12px; }
  #gearTitle { color: var(--gold); font-size: 1.05rem; }
  .gear .gh { color: var(--dim); font-size: .8rem; margin-left: 8px; }
  .gbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 8px 12px; border-top: 1px solid var(--line); }
  .gchg { color: var(--gold); font-size: .8rem; }
  .ggrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 10px; padding: 10px 12px; }
  .gcol { display: grid; gap: 6px; align-content: start; }
  .gbottom { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @media (max-width: 800px) { .ggrid, .gbottom { grid-template-columns: 1fr; } }
  .slot { display: flex; gap: 8px; align-items: flex-start; background: #161616; border: 1px solid var(--line);
          border-left: 3px solid transparent; border-radius: 4px; padding: 5px 8px; min-width: 0; }
  .slot.chg { border-left-color: var(--gold); }
  .slot.none { opacity: .55; }
  .slot svg { flex: none; color: var(--dim); }
  .sbody { min-width: 0; flex: 1; font-size: .85rem; line-height: 1.4; }
  .srow { display: flex; justify-content: space-between; gap: 6px; }
  .sslot { color: var(--dim); font-size: .72rem; }
  .sil { font-size: .78rem; }
  .sil b { color: var(--gold); font-weight: normal; }
  .sname { overflow-wrap: anywhere; }
  .sinfo { color: var(--dim); font-size: .72rem; overflow-wrap: anywhere; }
  .sinfo .warn { color: #e0a050; }
  .gsum { padding: 6px 12px 10px; border-top: 1px solid var(--line); font-size: .85rem; }
  .gsum .row { display: flex; flex-wrap: wrap; gap: 4px 18px; }
</style>
<!--__PLOTLY__-->
</head>
<body>
<div class="sub"><a class="back" id="back" hidden></a></div>
<h1 id="title"></h1>
<div class="sub" id="who"></div>
<div class="sub" id="span"></div>

<details class="gear" id="gear" hidden>
  <summary><span id="gearTitle"></span><span class="gh" id="gearHead"></span></summary>
  <div class="gbar">
    <button type="button" id="gPrev">◀</button>
    <select id="gScan"></select>
    <button type="button" id="gNext">▶</button>
    <label id="gCmpBox"><input type="checkbox" id="gCompare" checked> <span id="lblCompare"></span></label>
    <span class="gchg" id="gChanged"></span>
  </div>
  <div class="ggrid" id="gGrid"></div>
  <div class="gsum" id="gSum" hidden></div>
</details>

<div class="bar">
  <input type="search" id="q">
  <select id="cat"></select>
  <label><input type="checkbox" id="changed"> <span id="lblChanged"></span></label>
  <select id="mode"></select>
  <span class="count" id="count"></span>
</div>
<div class="main">
  <div>
    <div class="lead" id="lead"></div>
    <div class="list" id="list"></div>
  </div>
  <div class="chartbox">
    <div class="chips" id="chips"></div>
    <div id="chart"></div>
    <div class="hint" id="hint" hidden></div>
    <div class="note" id="skipped" hidden></div>
    <div class="note" id="oneScan" hidden></div>
    <div class="note" id="ilvlNote" hidden></div>
  </div>
</div>
<div class="note" id="note"></div>
<div class="foot" id="foot"></div>

<script>
const DATA = /*__DATA__*/null;

const $ = id => document.getElementById(id);

// UI texts come from the generator (src/i18n.py, html_* keys); {name} marks a value to fill in.
const UI = (DATA && DATA.ui) || {};
const fmt = (s, vals) => (s || "").replace(/\{(\w+)\}/g, (_, k) => (k in vals ? vals[k] : ""));

const MAX_LINES = 10;
const COLORS = ["#f4c430", "#5dd16b", "#4fa3ff", "#ff7a59", "#c792ea", "#2ec4b6", "#ff5d8f", "#b5cf6b", "#e0b080", "#8ab4f8"];
const DATE_TICKS = [   // tick labels of the time axis by tick distance (ms): with the time of day below a day, as stored
  {dtickrange: [null, 86400000], value: "%Y-%m-%d %H:%M"},
  {dtickrange: [86400000, null], value: "%Y-%m-%d"}
];
const FACTOR = {gold: 1 / 10000, seconds: 1 / 3600, number: 1};   // stored value -> shown value (copper -> gold, seconds -> hours)

const isNum = v => typeof v === "number" && isFinite(v);
const num = (v, digits) => v.toLocaleString(DATA.lang, {minimumFractionDigits: digits, maximumFractionDigits: digits});

let ALL = [];                 // the statistics that can be drawn (level first, then the numeric ones)
const BY_ID = new Map();
const chosen = new Set();     // ids, in the order they were picked

function shown(s) {
  const f = FACTOR[s.unit] || 1;
  return s.v.map(x => (isNum(x) ? x * f : null));
}

function valueText(s, x) {
  if (s.unit === "gold") return fmt(UI.groups_gold, {n: num(x, 2)});
  if (s.unit === "seconds") return fmt(UI.groups_hours, {n: num(x, 1)});
  return num(x, Number.isInteger(x) ? 0 : 2);
}

function changed(s) { return new Set(s.v.filter(isNum)).size > 1; }

function init() {
  document.documentElement.lang = (DATA && DATA.lang) || "en";
  document.title = UI.title || "StatTracker";
  if (!DATA || !DATA.char || !DATA.scans || !DATA.scans.length) {
    document.body.insertAdjacentHTML("beforeend", '<div class="empty"></div>');
    document.querySelector(".empty").textContent = UI.no_data || "";
    return;
  }
  if (DATA.back) {   // the link to the stats page (relative, set by the generator)
    $("back").href = DATA.back; $("back").textContent = UI.hist_back || ""; $("back").hidden = false;
  }
  const c = DATA.char;
  document.title = fmt(UI.hist_title, {char: c.key});
  $("title").textContent = document.title;
  $("who").textContent = [c.race, c.class, c.level].filter(Boolean).join(" · ");
  $("span").textContent = fmt(UI.hist_sub, {scans: DATA.scans.length, first: DATA.scans[0], last: DATA.scans[DATA.scans.length - 1]});

  if ((DATA.level || []).some(isNum)) ALL.push({id: "level", name: UI.hist_level || "", cat: UI.hist_level_cat || "", unit: "number", v: DATA.level});
  // The average item levels of the scans (scans.ilvl_*, since schema 3) are lines of their own, next to the level;
  // scans without one leave a gap. The decimals stay (valueText shows them).
  [["ilvl_equipped", UI.hist_ilvl_equipped], ["ilvl_total", UI.hist_ilvl_total]].forEach(([field, name]) => {
    const v = (DATA.gear || []).map(g => (g ? g[field] : null));
    if (v.some(isNum)) ALL.push({id: field, name: name || "", cat: UI.hist_level_cat || "", unit: "number", v: v});
  });
  ALL = ALL.concat(DATA.stats);
  ALL.forEach(s => BY_ID.set(s.id, s));

  $("q").placeholder = UI.search || "";
  $("lblChanged").textContent = UI.hist_only_changed || "";
  $("lead").textContent = fmt(UI.hist_pick, {n: MAX_LINES});
  $("note").textContent = UI.hist_note || "";
  $("ilvlNote").textContent = UI.hist_ilvl_note || "";
  const sel = $("cat");
  sel.add(new Option(UI.all_cats || "", ""));
  [...new Set(ALL.map(s => s.cat))].sort().forEach(k => sel.add(new Option(k, k)));
  const mode = $("mode");
  mode.add(new Option(UI.hist_mode_abs || "", "abs"));
  mode.add(new Option(UI.hist_mode_index || "", "index"));

  ["q", "cat", "changed"].forEach(id => $(id).addEventListener("input", renderList));
  mode.addEventListener("input", renderChart);

  if (BY_ID.has(-1)) chosen.add(-1);   // total played time: a first line to look at
  $("oneScan").textContent = DATA.scans.length < 2 ? (UI.hist_one_scan || "") : "";
  $("oneScan").hidden = DATA.scans.length >= 2;
  renderFoot();
  setupGear();
  renderList();
  renderChart();
}

function renderList() {
  const q = $("q").value.trim().toLowerCase();
  const cat = $("cat").value;
  const only = $("changed").checked;
  const rows = ALL.filter(s => {
    if (cat && s.cat !== cat) return false;
    if (q && !(s.name.toLowerCase().includes(q) || s.cat.toLowerCase().includes(q))) return false;
    return !only || changed(s) || chosen.has(s.id);
  });
  $("count").textContent = fmt(UI.hist_count, {shown: rows.length, total: ALL.length});
  const list = $("list");
  list.textContent = "";
  const frag = document.createDocumentFragment();
  rows.forEach(s => {
    const l = document.createElement("label");
    const cb = document.createElement("input");
    cb.type = "checkbox"; cb.checked = chosen.has(s.id); cb.dataset.id = String(s.id);
    cb.addEventListener("change", () => {
      if (cb.checked) chosen.add(s.id); else chosen.delete(s.id);
      syncLimit();
      renderChart();
    });
    const k = document.createElement("span");
    k.className = "cat"; k.textContent = s.cat;
    l.append(cb, " " + s.name, k);
    frag.append(l);
  });
  list.append(frag);
  syncLimit();
}

// At the limit the boxes that are not ticked are locked; ticked ones can always be unticked.
function syncLimit() {
  const full = chosen.size >= MAX_LINES;
  $("list").querySelectorAll("input").forEach(cb => {
    const off = full && !cb.checked;
    cb.disabled = off;
    cb.parentElement.classList.toggle("off", off);
    cb.title = off ? fmt(UI.hist_limit, {n: MAX_LINES}) : "";
  });
}

function renderChips(picked) {
  const box = $("chips");
  box.textContent = "";
  picked.forEach((s, i) => {
    const chip = document.createElement("span");
    chip.className = "chip";
    const dot = document.createElement("i");
    dot.style.background = COLORS[i % COLORS.length];
    const rm = document.createElement("button");
    rm.type = "button"; rm.textContent = "×"; rm.title = UI.groups_remove || "";
    rm.addEventListener("click", () => { chosen.delete(s.id); renderList(); renderChart(); });
    chip.append(dot, s.name, rm);
    box.append(chip);
  });
}

// One scan only: a window of a day around it, instead of the sub-second axis Plotly would pick.
function singleScanRange() {
  const t = new Date(DATA.scans[0].replace(" ", "T"));
  if (isNaN(t.getTime())) return undefined;
  const p = n => String(n).padStart(2, "0");
  const stamp = d => d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
  return [stamp(new Date(t.getTime() - 43200000)), stamp(new Date(t.getTime() + 43200000))];
}

function renderChart() {
  const picked = [...chosen].map(id => BY_ID.get(id)).filter(Boolean);
  renderChips(picked);
  $("ilvlNote").hidden = !chosen.has("ilvl_total");   // what "overall" means, only while that line is drawn
  const index = $("mode").value === "index";
  const skipped = [];
  const traces = [];
  picked.forEach((s, i) => {
    const vals = shown(s);
    let y = vals;
    if (index) {
      const first = vals.findIndex(isNum);
      const base = first < 0 ? 0 : vals[first];
      if (base === 0) { skipped.push(s.name); return; }   // no 100 % to measure against: not drawn, not guessed
      y = vals.map(x => (isNum(x) ? x / base * 100 : null));
    }
    traces.push({
      x: DATA.scans, y: y, name: s.name, mode: "lines+markers", connectgaps: false,
      line: {color: COLORS[i % COLORS.length], width: 2}, marker: {size: 6},
      customdata: vals.map(x => (isNum(x) ? valueText(s, x) : "")),
      hovertemplate: "%{customdata}<extra>%{fullData.name}</extra>"
    });
  });

  $("skipped").hidden = !skipped.length;
  $("skipped").textContent = skipped.length ? fmt(UI.hist_index_skipped, {names: skipped.join(", ")}) : "";
  const chart = $("chart");
  if (typeof Plotly === "undefined") {
    chart.hidden = true;
    $("hint").hidden = false; $("hint").textContent = UI.hist_no_chart || "";
    return;
  }
  if (!traces.length) {
    Plotly.purge(chart);
    chart.hidden = true;
    $("hint").hidden = !!picked.length; $("hint").textContent = picked.length ? "" : (UI.hist_none_selected || "");
    return;
  }
  $("hint").hidden = true;
  chart.hidden = false;
  Plotly.react(chart, traces, {
    paper_bgcolor: "#1b1b1b", plot_bgcolor: "#101010", font: {color: "#e0e0e0"},
    margin: {l: 64, r: 24, t: 16, b: 48}, height: 480, hovermode: "x unified",
    legend: {orientation: "h", y: -0.2},
    xaxis: {type: "date", gridcolor: "#2e2e2e", hoverformat: "%Y-%m-%d %H:%M",
            tickformatstops: DATE_TICKS,   // numbers only: Plotly would name the months in English on every page
            range: DATA.scans.length === 1 ? singleScanRange() : undefined},
    yaxis: {gridcolor: "#2e2e2e", zeroline: false, hoverformat: ",.2f"}
  }, {responsive: true, displaylogo: false});
}

// ---- Character: the equipment of one scan, as in the game's character screen (data: DATA.gear, one entry per scan
// or null; texts: DATA.names). The shirt (4) and the tabard (19) are not shown. Nothing is guessed: a missing name shows
// the item id, a missing stat name its raw key, an unknown upgrade track the stored text.
const GEAR = (DATA && DATA.gear) || null;
const NAMES = (DATA && DATA.names) || {};
const SLOTS_LEFT = [1, 2, 3, 15, 5, 9];
const SLOTS_RIGHT = [10, 6, 7, 8, 11, 12, 13, 14];
const SLOTS_BOTTOM = [16, 17];
const SECONDARY = ["ITEM_MOD_CRIT_RATING_SHORT", "ITEM_MOD_HASTE_RATING_SHORT", "ITEM_MOD_MASTERY_RATING_SHORT", "ITEM_MOD_VERSATILITY"];
const QUALITY_COLOR = {0: "#9d9d9d", 1: "#ffffff", 2: "#4fd04f", 3: "#4a9eff", 4: "#c070f5", 5: "#ff8000", 6: "#e6cc80", 7: "#00ccff", 8: "#00ccff"};
const SLOT_ICON = {   // outline symbols, 24 x 24, drawn here: no image files, nothing loaded
  1: '<path d="M5 14a7 7 0 0 1 14 0v5h-4v-3H9v3H5z"/>',
  2: '<path d="M5 5c0 8 4 11 7 11s7-3 7-11"/><circle cx="12" cy="19" r="2.5"/>',
  3: '<path d="M3 17c0-6 4-10 9-10s9 4 9 10z"/>',
  5: '<path d="M8 4 3 8l2 4 3-1v9h8v-9l3 1 2-4-5-4c-1 2-2 3-4 3S9 6 8 4z"/>',
  6: '<rect x="3" y="9" width="18" height="6" rx="1"/><rect x="9.5" y="8" width="5" height="8" rx="1"/>',
  7: '<path d="M7 3h10l1 18h-5l-1-10-1 10H6z"/>',
  8: '<path d="M8 3h6v9l6 3v5H5v-4l3-1z"/>',
  9: '<rect x="6" y="6" width="12" height="12" rx="3"/><path d="M6 10h12M6 14h12"/>',
  10: '<path d="M8 21v-6L5 9l2-1 2 3V4h2v7V3h2v8V5h2v7V8l2 1v6l-2 6z"/>',
  11: '<circle cx="12" cy="14" r="6"/><path d="m9 6 3-3 3 3-3 3z"/>',
  12: '<circle cx="12" cy="14" r="6"/><path d="m9 6 3-3 3 3-3 3z"/>',
  13: '<path d="m12 3 2.5 6 6.5.5-5 4.3 1.6 6.4-5.6-3.4-5.6 3.4L8 13.8 3 9.5 9.5 9z"/>',
  14: '<path d="m12 3 2.5 6 6.5.5-5 4.3 1.6 6.4-5.6-3.4-5.6 3.4L8 13.8 3 9.5 9.5 9z"/>',
  15: '<path d="M8 3h8l3 17-7-3-7 3z"/>',
  16: '<path d="m19 3 2 2-9 9-3-3z"/><path d="m8 12 4 4M5 19l4-4M4 20l2-2"/>',
  17: '<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>'
};
let gearScans = [];   // the positions in DATA.scans that have equipment data
let gearPos = 0;      // the shown one, as a position in gearScans

const slotIcon = slot => '<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" ' +
  'stroke-linejoin="round" stroke-linecap="round" aria-hidden="true">' + (SLOT_ICON[slot] || "") + "</svg>";
const itemsBySlot = g => new Map((g.items || []).map(it => [it.slot, it]));

// What makes two equipped items "the same" for the comparison; a stat or the name alone never counts.
function sameItem(a, b) {
  return a.item_id === b.item_id && a.ilvl === b.ilvl && a.enchant_id === b.enchant_id && a.upg_track_id === b.upg_track_id &&
    a.upg_level === b.upg_level && JSON.stringify(a.gem_ids) === JSON.stringify(b.gem_ids);
}

function upgradeText(it) {
  const track = (NAMES.track && NAMES.track[String(it.upg_track_id)]) || it.upg_track;
  if (!track) return "";
  return isNum(it.upg_level) && isNum(it.upg_max) ? track + " " + it.upg_level + "/" + it.upg_max : track;
}

// Empty sockets are counted from gem_ids only (0 = empty); a missing list is "unknown", never "empty".
function emptySockets(it) {
  return Array.isArray(it.gem_ids) && isNum(it.sockets) && it.sockets > 0 ? it.gem_ids.filter(id => id === 0).length : 0;
}

function statLines(it) {
  return Object.keys(it.stats || {}).filter(k => !k.startsWith("EMPTY_SOCKET")).map(k => ((NAMES.stat && NAMES.stat[k]) || k) + " " + it.stats[k]);
}

function slotCard(slot, it, old, compare) {
  const card = document.createElement("div");
  card.className = "slot";
  const ico = document.createElement("span");
  ico.innerHTML = slotIcon(slot);
  const body = document.createElement("div");
  body.className = "sbody";
  const top = document.createElement("div");
  top.className = "srow";
  const label = document.createElement("span");
  label.className = "sslot"; label.textContent = (NAMES.slot && NAMES.slot[String(slot)]) || "#" + slot;
  const il = document.createElement("span");
  il.className = "sil";
  top.append(label, il);
  const name = document.createElement("div");
  name.className = "sname";
  const info = document.createElement("div");
  info.className = "sinfo";
  body.append(top, name, info);
  card.append(ico, body);
  let changed = false;
  if (it) {
    if (isNum(it.ilvl)) il.textContent = String(it.ilvl);
    name.textContent = it.name || "#" + it.item_id;
    name.style.color = QUALITY_COLOR[it.quality] || "#e0e0e0";
    const bits = [upgradeText(it), it.enchant_text || ""].filter(Boolean);
    info.textContent = bits.join(" · ");
    const n = emptySockets(it);
    if (n) {
      const warn = document.createElement("span");
      warn.className = "warn";
      warn.textContent = n === 1 ? (UI.hist_gear_socket_empty || "") : fmt(UI.hist_gear_sockets_empty, {n: n});
      if (bits.length) info.append(" · ");
      info.append(warn);
    }
    const lines = statLines(it);
    if (lines.length) card.title = lines.join("\n");
  } else {
    card.classList.add("none");
    info.textContent = UI.hist_gear_empty || "";
  }
  if (compare) {
    changed = (!!it !== !!old) || (!!it && !sameItem(it, old));
    if (it && old && isNum(it.ilvl) && isNum(old.ilvl) && it.ilvl !== old.ilvl) {
      const d = it.ilvl - old.ilvl;
      const b = document.createElement("b");
      b.textContent = " (" + (d > 0 ? "+" : "") + d + ")";
      il.append(b);
    }
  }
  card.classList.toggle("chg", changed);
  return {card: card, changed: changed};
}

function renderGear() {
  const g = GEAR[gearScans[gearPos]];
  const prev = gearPos > 0 && $("gCompare").checked ? GEAR[gearScans[gearPos - 1]] : null;
  $("gScan").value = String(gearPos);
  $("gPrev").disabled = gearPos === 0;
  $("gNext").disabled = gearPos === gearScans.length - 1;

  const role = {TANK: UI.hist_gear_role_tank, HEALER: UI.hist_gear_role_healer, DAMAGER: UI.hist_gear_role_damager}[g.role];
  const head = [];
  if (g.spec_name) head.push(g.spec_name + (role ? " (" + role + ")" : ""));
  if (isNum(g.ilvl_total) || isNum(g.ilvl_equipped)) {
    const n = x => (isNum(x) ? valueText({unit: "number"}, x) : "–");
    head.push(fmt(UI.hist_gear_ilvl, {total: n(g.ilvl_total), equipped: n(g.ilvl_equipped)}));
  }
  $("gearHead").textContent = head.length ? "· " + head.join(" · ") : "";

  const now = itemsBySlot(g), before = prev ? itemsBySlot(prev) : null;
  let changed = 0;
  const column = slots => {
    const col = document.createElement("div");
    col.className = "gcol";
    slots.forEach(s => {
      const r = slotCard(s, now.get(s), before && before.get(s), !!before);
      if (r.changed) changed++;
      col.append(r.card);
    });
    return col;
  };
  const bottom = column(SLOTS_BOTTOM);
  bottom.className = "gbottom";
  $("gGrid").replaceChildren(column(SLOTS_LEFT), column(SLOTS_RIGHT), bottom);
  $("gChanged").textContent = !before ? "" : (changed ? fmt(UI.hist_gear_changed, {n: changed}) : (UI.hist_gear_unchanged || ""));

  // The sum of the stats the parts carry (not the gems' values, which the data does not have).
  const sums = SECONDARY.map(k => {
    const have = (g.items || []).filter(it => it.stats && isNum(it.stats[k]));
    return have.length ? {key: k, value: have.reduce((t, it) => t + it.stats[k], 0)} : null;
  }).filter(Boolean);
  const sum = $("gSum");
  sum.hidden = !sums.length;
  sum.textContent = "";
  if (sums.length) {
    const cap = document.createElement("div");
    cap.className = "sslot"; cap.textContent = UI.hist_gear_sum || "";
    const row = document.createElement("div");
    row.className = "row";
    sums.forEach(s => {
      const el = document.createElement("span");
      el.textContent = ((NAMES.stat && NAMES.stat[s.key]) || s.key) + " " + num(s.value, 0);
      row.append(el);
    });
    const note = document.createElement("div");
    note.className = "sinfo"; note.textContent = UI.hist_gear_gems_note || "";
    sum.append(cap, row, note);
  }
}

function setupGear() {
  gearScans = (GEAR || []).map((g, i) => (g ? i : -1)).filter(i => i >= 0);
  if (!gearScans.length) return;                  // no equipment in the database (before schema 3): no block
  $("gear").hidden = false;
  $("gearTitle").textContent = UI.hist_gear_title || "";
  $("lblCompare").textContent = UI.hist_gear_compare || "";
  $("gPrev").title = UI.hist_gear_prev || "";
  $("gNext").title = UI.hist_gear_next || "";
  const sel = $("gScan");
  for (let n = gearScans.length - 1; n >= 0; n--) {       // the newest scan first
    const i = gearScans[n];
    sel.add(new Option(fmt(UI.hist_gear_scan_n, {when: DATA.scans[i], n: i + 1, total: DATA.scans.length}), String(n)));
  }
  const several = gearScans.length > 1;
  ["gPrev", "gNext", "gCmpBox"].forEach(id => { $(id).hidden = !several; });
  gearPos = gearScans.length - 1;
  sel.addEventListener("input", () => { gearPos = Number(sel.value); renderGear(); });
  $("gPrev").addEventListener("click", () => { if (gearPos > 0) { gearPos--; renderGear(); } });
  $("gNext").addEventListener("click", () => { if (gearPos < gearScans.length - 1) { gearPos++; renderGear(); } });
  $("gCompare").addEventListener("input", renderGear);
  renderGear();
}

// Version, link to the project page and copyright (values from src/app_info.py via the generator), and the
// chart library the page carries.
function renderFoot() {
  const A = DATA.app;
  if (!A) return;
  const link = document.createElement("a");
  link.href = A.site; link.target = "_blank"; link.rel = "noopener noreferrer";
  link.textContent = A.site.replace(/^https:\/\//, "").replace(/\/$/, "");
  $("foot").append(fmt(UI.footer_version, {version: A.version}), " · ", link, " · " + A.copyright + " · " + A.license,
    " · " + fmt(UI.hist_plotly, {version: DATA.plotly}));
}

init();
</script>
